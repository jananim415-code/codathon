<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | ProjectSphere</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="content auth-page"><section class="panel"><h1>ProjectSphere</h1><p>Sign in to create and manage workspace data.</p><div class="auth-tabs"><button id="loginTab" class="primary-btn">Sign in</button><button id="registerTab" class="secondary-btn">Register</button></div>
<form id="authForm" class="form-grid"><input name="name" placeholder="Full name" hidden><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password (8+ characters)" required><input name="githubUsername" placeholder="GitHub username" hidden><button class="primary-btn" type="submit">Sign in</button></form><p><a href="/index.html">Back to dashboard</a></p></section></main><script src="/js/api.js"></script><script src="/js/auth.js"></script></body></html>
