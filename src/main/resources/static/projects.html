<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | ProjectSphere</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">P</div>
            <div>
                <h1>ProjectSphere</h1>
                <small>Unified Student Collaboration</small>
            </div>
        </div>
        <nav>
            <a href="/index.html">Dashboard</a>
            <a href="/teams.html">Teams</a>
            <a href="/users.html">Users</a>
            <a href="/projects.html" class="active">Projects</a>
            <a href="/tasks.html">Tasks</a>
            <a href="/documents.html">Documents</a>
            <a href="/intelligence.html">Team Intelligence</a>
            <a href="/reports.html">Reports</a>
        </nav>
    </aside>
    <main class="content">
        <header class="topbar">
            <div><h2>Projects</h2></div>
        </header>
        <section class="panel">
            <h3>Create Project</h3>
            <form id="projectForm" class="form-grid">
                <input name="name" placeholder="Project name" required>
                <input name="description" placeholder="Description">
                <input name="deadline" type="date">
                <input name="githubRepositoryUrl" placeholder="GitHub repository URL">
                <select name="teamId" id="teamSelect"><option value="">No team</option></select>
                <select name="status">
                    <option value="ACTIVE">ACTIVE</option>
                    <option value="COMPLETED">COMPLETED</option>
                    <option value="AT_RISK">AT_RISK</option>
                    <option value="STALLED">STALLED</option>
                </select>
                <button type="submit" class="primary-btn">Create Project</button>
            </form>
        </section>
        <section class="panel">
            <h3>Project List</h3>
            <div id="projectList" class="card-grid"><p class="empty-state">Loading projects…</p></div>
        </section>
    </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/projects.js"></script>
</body>
</html>
