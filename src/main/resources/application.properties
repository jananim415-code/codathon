server.port=8080
spring.application.name=ProjectSphere

# Default in-memory dev database. PostgreSQL can be used via DB_URL env var.
spring.datasource.url=${DB_URL:jdbc:h2:mem:projectsphere;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Run with H2 by default for demo mode. PostgreSQL is supported when DB_URL points to Postgres.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.demo-mode=true
app.github.token=${GITHUB_TOKEN:}
app.github.demo-repository=https://github.com/example/student-project

# Scheduling
app.analysis.fixed-delay-ms=300000

# Misc
spring.jackson.serialization.write-dates-as-timestamps=false
