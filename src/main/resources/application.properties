server.port=8080
spring.application.name=ProjectSphere
spring.profiles.default=dev

# H2 is the safe local/demo default. Production uses the prod profile.
spring.datasource.url=${DB_URL:jdbc:h2:mem:projectsphere;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.demo-mode=true
app.github.token=${GITHUB_TOKEN:}
app.github.demo-repository=${GITHUB_REPOSITORY_URL:https://github.com/example/student-project}
app.github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}
app.analysis.fixed-delay-ms=${ANALYSIS_FIXED_DELAY_MS:300000}

# Use a base64 encoded secret containing at least 32 bytes in production.
app.security.jwt-secret=${JWT_SECRET:}
app.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:3600000}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
# Existing DTO mappings traverse lazy associations during response serialization.
spring.jpa.open-in-view=true
spring.jackson.serialization.write-dates-as-timestamps=false
